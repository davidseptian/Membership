<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Member Hypospot</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#141414;--line:#2a2410;--gold:#d4af37;--gold2:#f2d46b;--tx:#ece6d3;--mut:#9a927a;--bad:#e5735a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--tx:#ece6d3}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
.w{max-width:1040px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:24px;font-weight:800;margin:0;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{color:var(--gold);margin:22px 0 8px;font-size:15px}
.mut{color:var(--mut)}.pill{font-size:11px;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:1px 9px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:4px}
.tabs button{white-space:nowrap}
button{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
button.on,button.p{background:linear-gradient(90deg,var(--gold),#b8912a);color:#111}
button.x{border-color:var(--line);color:var(--mut);padding:3px 9px;font-size:12px}
input,select,textarea{background:#050505;color:var(--tx);border:1px solid #3a3217;border-radius:8px;padding:8px 10px;font:inherit;width:100%}
textarea{min-height:90px;font-family:ui-monospace,monospace;font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.k b{display:block;font-size:22px;color:var(--gold2);font-weight:800}.k span{font-size:12px;color:var(--mut)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
th{background:linear-gradient(90deg,var(--gold),#b8912a);color:#111;text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}.r{text-align:right}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--gold2));min-width:2px}
.row{display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;margin:5px 0;font-size:12.5px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.s-Aktif{color:#8fd694}.s-Mulai{color:var(--gold2)}.s-Dormant{color:var(--bad)}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--gold);color:#111;border-radius:10px;padding:10px 14px;font-weight:600;display:none;z-index:9}
</style>
</head>
<body>
<div class="w">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h1>Dashboard Member Hypospot</h1><span class="pill" id="st"></span></div>
<div class="tabs" id="tabs"></div>
<div id="flt" class="card f"></div>
<div id="app"></div>
</div>
<div id="msg"></div>
<script>
var TIER=[[150000,1],[300000,2],[550000,3],[800000,4],[1000000,5],[1500000,6],[1e15,8]];
var RW=[[4,"Cleaner 100ml (semua varian), Balsam, Lotion, Lem 100ml, Unyellowing, Parfum Travel, Suede Brush & Eraser"],[5,"Cleaner 200ml, Microfiber 3pcs, Parfum 100ml, Cleaner Foam, Whitening Only"],[6,"Cleaner 250ml, Unyellowing 250ml, Parfum 200ml, Lem 200ml, Starterkit Simple"],[7,"Cleaner 500ml, Unyellowing 500ml, Parfum 250ml, Whitening & Sour, Starterkit Wire Brush"],[8,"Cleaner 750ml, Unyellowing 750ml, Parfum 400ml, Starterkit Premium, Whitening 250ml"],[9,"1L Cleaner, 1L Unyellowing, 500ml Parfum, 500ml Whitening"],[13,"2L Cleaner, 2L Unyellowing, 1L Parfum, 1L Whitening"],[17,"3L Cleaner, 3L Unyellowing"]];
var CH=["Shopee","Tokopedia","TikTok Shop","WhatsApp","Offline"],PK=["Member Point","Titip Jual","Affiliator","Full Support"];
var SEED="HYPO00054|DavidOPPP|dadadav|dadadav||Titip Jual\nHYPO00055|Del|dededel|dededel||Affiliator\nHYPO00056|hadi|hadhad|hadhad||Full Support\nHYPO00057|Dino|dindin|dindin||Full Support\nHYPO00058|David|Unfayoh|Hdavuro||Full Support\nHYPO00059|akudewe|pebriraditiya|Hadi||Member Point\nHYPO00061|Lori|loridagfbi|lorisshai||Member Point\nHYPO00062|Adhiasta|adhiastabps|Adhiasta||Member Point\nHYPO00063|leonidas Sony Pratama|umz umox|leonidassony||Member Point\nHYPO00064|DAYCLEAN|hidayattwi|ayattt||Member Point\nHYPO00065|Teh Rita||Rita Travel Haji Dan Umroh|@tehdinarnova|Member Point\nHYPO00066|Imam muchlas hrp|Imammuchlashrp|Storyo||Member Point\nHYPO00067|Kartiko|Kartikocahyono|Sinyo||Member Point\nHYPO00068|AMEY|amwinkel|-||Member Point\nHYPO00069|Ian darmawan|Axews|Inay poenya||Member Point\nHYPO00070|Wahono||Wahono||Member Point\nHYPO00071|Muh Iqbal|iq_shope|iqball||Member Point\nHYPO00072|Valentino Christian|valentinoliem|Valentinoliem||Member Point\nHYPO00073|muhamad hakam alfani|alpan385|apsaraaa||Member Point\nHYPO00074|Mukarrabin|8r3y6tkse9|mukarrabin||Member Point\nHYPO00075|RIDHAURRAHMAN|ridhaurrahman_iedo|ridhaurrahman_iedo||Member Point";
var $=function(i){return document.getElementById(i)};
var S={members:[],orders:[],redeems:[],v:0},F={from:"",to:""},tab="dash",Q="",E=null,ref=null,DL=null,TM;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rp(n){return "Rp"+Math.round(n).toLocaleString("id-ID")}
function nm(n){return Math.round(n).toLocaleString("id-ID")}
function poin(t){if(t<=0)return 0;for(var i=0;i<TIER.length;i++)if(t<=TIER[i][0])return TIER[i][1];return 0}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){s=String(s||"").trim();var m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");m=s.match(/^\d{4}-\d{2}-\d{2}/);return m?m[0]:""}
function pn(s){return parseInt(String(s||"").replace(/[^\d]/g,""))||0}
function days(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function toast(t){var m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(TM);TM=setTimeout(function(){m.style.display="none"},3500)}
function load(j){try{var x=JSON.parse(j);S.members=x.members||[];S.orders=x.orders||[];S.redeems=x.redeems||[];S.v=x.v||0}catch(e){}}
function save(){S.v++;try{localStorage.setItem("hypo_member",JSON.stringify(S))}catch(e){}if(ref)ref.set({json:JSON.stringify(S)}).catch(function(e){toast("Gagal simpan bersama: "+(e.message||e.code))});R()}
function nextId(){var mx=53;S.members.forEach(function(m){var n=pn(String(m.id).replace("HYPO",""));if(n>mx)mx=n});return "HYPO"+String(mx+1).padStart(5,"0")}
function find(q){q=String(q||"").trim();if(!q)return null;var c=q.split(" · ")[0].toLowerCase();for(var i=0;i<S.members.length;i++){var m=S.members[i];if([m.id,m.nama,m.shopee,m.tokped,m.tiktok,m.wa].some(function(v){return v&&String(v).toLowerCase()===c}))return m}return null}
function inR(d){return(!F.from||d>=F.from)&&(!F.to||d<=F.to)}
function calc(){var m={},td=today();S.members.forEach(function(x){m[x.id]={m:x,n:0,q:0,o:0,all:[],earn:0,red:0}});
S.orders.forEach(function(o){var r=m[o.m];if(!r||o.s!=="selesai")return;r.all.push(o.d);r.earn+=o.p;if(inR(o.d)){r.n++;r.q+=o.q;r.o+=o.t}});
S.redeems.forEach(function(x){if(m[x.m])m[x.m].red+=x.p});
var L=Object.keys(m).map(function(k){var r=m[k];r.all.sort();r.saldo=r.earn-r.red;r.cnt=r.all.length;r.last=r.cnt?r.all[r.cnt-1]:"";r.rec=r.last?days(r.last,td):null;r.gap=r.cnt>1?Math.round(days(r.all[0],r.last)/(r.cnt-1)):null;r.seg=!r.cnt?"Belum order":r.rec<=30?"Aktif":r.rec<=90?"Mulai pasif":"Dormant";return r});return L}
function segc(s){return s==="Aktif"?"s-Aktif":s==="Mulai pasif"?"s-Mulai":s==="Dormant"?"s-Dormant":"mut"}
function sum(a,f){return a.reduce(function(s,x){return s+f(x)},0)}
function bars(rows,fmt){var mx=Math.max.apply(null,rows.map(function(r){return r[1]}).concat([1]));return rows.map(function(r){return '<div class="row"><span>'+esc(r[0])+'</span><div><div class="bar" style="width:'+(r[1]/mx*100)+'%"></div></div><span class="r">'+fmt(r)+'</span></div>'}).join("")||'<p class="mut">Belum ada data.</p>'}
var TB=[["dash","Dashboard"],["mem","Member"],["ord","Input Order"],["his","Riwayat"],["red","Tukar Poin"],["dat","Data"]];
function go(t){tab=t;R()}
function R(){$("tabs").innerHTML=TB.map(function(t){return '<button class="'+(t[0]===tab?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
$("st").textContent=ref?"Tersimpan bersama":"Tersimpan di browser ini";
var show=tab==="dash"||tab==="mem";$("flt").style.display=show?"grid":"none";
if(show){$("flt").innerHTML='<div><label>Periode dari</label><input type="date" value="'+F.from+'" onchange="F.from=this.value;R()"></div><div><label>Sampai</label><input type="date" value="'+F.to+'" onchange="F.to=this.value;R()"></div><div><button onclick="F.from=F.to=\'\';R()">Semua waktu</button></div>'}
$("app").innerHTML=V[tab]();if(tab==="mem"&&E)fillM();if(tab==="ord")prev()}
var V={};
V.dash=function(){var L=calc(),os=S.orders.filter(function(o){return o.s==="selesai"&&inR(o.d)}),act=L.filter(function(r){return r.n>0}),rd=sum(S.redeems.filter(function(x){return inR(x.d)}),function(x){return x.p}),rep=act.filter(function(r){return r.n>1}).length;
var K=[["Total member",S.members.length],["Member aktif (periode)",act.length],["Order selesai",os.length],["Qty terjual",nm(sum(os,function(o){return o.q}))],["Omzet member",rp(sum(os,function(o){return o.t}))],["Poin diberikan",sum(os,function(o){return o.p})],["Poin ditukar",rd],["Saldo poin beredar",sum(L,function(r){return r.saldo})],["Rata-rata order / member aktif",act.length?(os.length/act.length).toFixed(1):"0"],["Repeat order (2+ order)",act.length?Math.round(rep/act.length*100)+"%":"0%"]];
var mo={},cc={};os.forEach(function(o){var k=o.d.slice(0,7);mo[k]=mo[k]||[0,0];mo[k][0]++;mo[k][1]+=o.t;cc[o.c]=(cc[o.c]||0)+1});
var mr=Object.keys(mo).sort().slice(-12).map(function(k){return[k,mo[k][0],mo[k][1]]}),cr=Object.keys(cc).map(function(k){return[k,cc[k]]}).sort(function(a,b){return b[1]-a[1]});
var sg={};L.forEach(function(r){sg[r.seg]=(sg[r.seg]||0)+1});
var top=L.filter(function(r){return r.n>0}).sort(function(a,b){return b.o-a.o}).slice(0,10);
return '<div class="g">'+K.map(function(k){return '<div class="k"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'}).join("")+'</div>'+
'<h3>Order per bulan</h3><div class="card">'+bars(mr,function(r){return r[1]+" order · "+rp(r[2])})+'</div>'+
'<h3>Order per channel</h3><div class="card">'+bars(cr,function(r){return r[1]+" order"})+'</div>'+
'<h3>Segmen frekuensi (berdasarkan order terakhir)</h3><div class="g">'+["Aktif","Mulai pasif","Dormant","Belum order"].map(function(s){return '<div class="k"><b class="'+segc(s)+'">'+(sg[s]||0)+'</b><span>'+s+(s==="Aktif"?" (≤30 hari)":s==="Mulai pasif"?" (31–90 hari)":s==="Dormant"?" (>90 hari)":"")+'</span></div>'}).join("")+'</div>'+
'<h3>Top 10 member (omzet periode)</h3><div class="card sc"><table><tr><th>Member</th><th class="r">Order</th><th class="r">Qty</th><th class="r">Omzet</th><th class="r">Saldo poin</th></tr>'+(top.map(function(r){return '<tr><td>'+esc(r.m.nama)+' <span class="mut">'+r.m.id+'</span></td><td class="r">'+r.n+'</td><td class="r">'+r.q+'</td><td class="r">'+rp(r.o)+'</td><td class="r">'+r.saldo+'</td></tr>'}).join("")||'<tr><td colspan="5" class="mut">Belum ada order pada periode ini.</td></tr>')+'</table></div>'};
V.mem=function(){var L=calc().filter(function(r){var q=Q.toLowerCase();return!q||[r.m.id,r.m.nama,r.m.shopee,r.m.tokped,r.m.tiktok].join(" ").toLowerCase().indexOf(q)>-1});
return '<div class="card"><div class="f"><div><label>Kode</label><input id="mi" disabled></div><div><label>Nama *</label><input id="mn"></div><div><label>Akun Shopee</label><input id="ms"></div><div><label>Akun Tokopedia</label><input id="mt"></div><div><label>Akun TikTok</label><input id="mk"></div><div><label>WhatsApp</label><input id="mw" inputmode="tel"></div><div><label>Paket</label><select id="mp">'+PK.map(function(p){return '<option>'+p+'</option>'}).join("")+'</select></div><div><button class="p" onclick="saveM()">'+(E?"Simpan perubahan":"Tambah member")+'</button></div></div></div>'+
'<input placeholder="Cari kode, nama, atau akun…" value="'+esc(Q)+'" onchange="Q=this.value;R()" style="margin:8px 0">'+
'<div class="card sc"><table><tr><th>Kode</th><th>Nama</th><th class="r">Order</th><th class="r">Qty</th><th class="r">Omzet</th><th class="r">Poin diperoleh</th><th class="r">Ditukar</th><th class="r">Saldo</th><th class="r">Rata-rata hari antar order</th><th>Order terakhir</th><th>Segmen</th><th></th></tr>'+
L.map(function(r){return '<tr><td>'+r.m.id+'</td><td>'+esc(r.m.nama)+'<br><span class="mut">'+esc([r.m.shopee,r.m.tokped,r.m.tiktok].filter(Boolean).join(" / "))+'</span></td><td class="r">'+r.n+'</td><td class="r">'+r.q+'</td><td class="r">'+rp(r.o)+'</td><td class="r">'+r.earn+'</td><td class="r">'+r.red+'</td><td class="r"><b>'+r.saldo+'</b></td><td class="r">'+(r.gap==null?"-":r.gap)+'</td><td>'+(r.last||"-")+'</td><td class="'+segc(r.seg)+'">'+r.seg+'</td><td><button class="x" onclick="E=\''+r.m.id+'\';R();scrollTo(0,0)">ubah</button></td></tr>'}).join("")+'</table></div>'};
function fillM(){var m=S.members.filter(function(x){return x.id===E})[0];if(!m)return;$("mi").value=m.id;$("mn").value=m.nama;$("ms").value=m.shopee||"";$("mt").value=m.tokped||"";$("mk").value=m.tiktok||"";$("mw").value=m.wa||"";$("mp").value=m.paket||PK[0]}
function saveM(){var n=$("mn").value.trim();if(!n)return toast("Nama wajib diisi");var o={id:E||nextId(),nama:n,shopee:$("ms").value.trim(),tokped:$("mt").value.trim(),tiktok:$("mk").value.trim(),wa:$("mw").value.trim(),paket:$("mp").value};
if(E){S.members=S.members.map(function(x){return x.id===E?o:x})}else S.members.push(o);E=null;toast("Member tersimpan: "+o.id);save()}
V.ord=function(){var dl='<datalist id="dl">'+S.members.map(function(m){return '<option value="'+esc(m.id+" · "+m.nama)+'">'}).join("")+'</datalist>';
return dl+'<div class="card"><div class="f"><div><label>Tanggal</label><input type="date" id="od" value="'+today()+'"></div><div><label>Member (kode / nama / akun)</label><input id="om" list="dl" placeholder="ketik untuk mencari"></div><div><label>Channel</label><select id="oc">'+CH.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></div><div><label>No. pesanan</label><input id="on"></div><div><label>Nilai belanja (Rp)</label><input id="ot" inputmode="numeric" oninput="prev()"></div><div><label>Qty produk</label><input id="oq" inputmode="numeric" value="1"></div><div><label>Status</label><select id="os"><option value="selesai">selesai</option><option value="batal">batal / retur</option></select></div></div><p>Poin yang didapat: <b id="pv" style="color:var(--gold2)">0</b></p><button class="p" onclick="addO()">Simpan order</button></div>'+
'<h3>Tempel banyak order sekaligus</h3><div class="card"><p class="mut">Satu baris satu order, kolom dipisah tab (salin dari Sheets/Excel) atau koma: <b>tanggal, kode/akun member, channel, no pesanan, nilai belanja, qty, status (opsional)</b>. Tanggal boleh DD/MM/YYYY.</p><textarea id="bk" placeholder="25/10/2026,HYPO00075,Shopee,2510ABC,320000,3"></textarea><p><button class="p" onclick="bulk()">Impor order</button></p></div>'};
function prev(){var e=$("pv");if(e)e.textContent=poin(pn($("ot").value))}
function mkO(d,mm,c,no,t,q,s){var m=find(mm);if(!m)return"Member tidak ditemukan: "+mm;d=pd(d);if(!d)return"Tanggal tidak valid";if(t<=0)return"Nilai belanja harus lebih dari 0";if(no&&S.orders.some(function(o){return o.no===no&&o.c===c}))return"Nomor pesanan sudah ada: "+no;
S.orders.push({i:Date.now()+Math.random().toString(36).slice(2,6),d:d,m:m.id,c:c,no:no,t:t,q:q||1,s:s==="batal"?"batal":"selesai",p:poin(t)});return""}
function addO(){var e=mkO($("od").value,$("om").value,$("oc").value,$("on").value.trim(),pn($("ot").value),pn($("oq").value),$("os").value);if(e)return toast(e);toast("Order tersimpan");tab="ord";save()}
function bulk(){var ok=0,er=[];$("bk").value.split("\n").forEach(function(l,i){if(!l.trim())return;var c=l.indexOf("\t")>-1?l.split("\t"):l.split(",");var e=mkO(c[0],c[1],(c[2]||"").trim(),(c[3]||"").trim(),pn(c[4]),pn(c[5]),(c[6]||"").trim().toLowerCase());if(e)er.push("Baris "+(i+1)+": "+e);else ok++});if(ok)save();toast(ok+" order masuk"+(er.length?". Gagal: "+er.slice(0,3).join("; "):""))}
V.his=function(){var q=Q.toLowerCase(),mm={};S.members.forEach(function(m){mm[m.id]=m});var L=S.orders.slice().sort(function(a,b){return a.d<b.d?1:-1}).filter(function(o){return!q||(o.m+" "+(mm[o.m]?mm[o.m].nama:"")+" "+o.no+" "+o.c).toLowerCase().indexOf(q)>-1}).slice(0,200);
return '<input placeholder="Cari member, no pesanan, channel…" value="'+esc(Q)+'" onchange="Q=this.value;R()" style="margin-bottom:8px"><div class="card sc"><table><tr><th>Tanggal</th><th>Member</th><th>Channel</th><th>No. pesanan</th><th class="r">Nilai</th><th class="r">Qty</th><th class="r">Poin</th><th>Status</th><th></th></tr>'+(L.map(function(o){return '<tr><td>'+o.d+'</td><td>'+esc(mm[o.m]?mm[o.m].nama:o.m)+'</td><td>'+esc(o.c)+'</td><td>'+esc(o.no)+'</td><td class="r">'+rp(o.t)+'</td><td class="r">'+o.q+'</td><td class="r">'+(o.s==="selesai"?o.p:0)+'</td><td><button class="x" onclick="tgl(\''+o.i+'\')">'+o.s+'</button></td><td><button class="x" onclick="delO(\''+o.i+'\')">hapus</button></td></tr>'}).join("")||'<tr><td colspan="9" class="mut">Belum ada order.</td></tr>')+'</table></div><p class="mut">Menampilkan maksimal 200 order terbaru. Klik status untuk mengubah selesai/batal (poin ikut dihitung ulang).</p>'};
function tgl(i){S.orders.forEach(function(o){if(o.i===i)o.s=o.s==="selesai"?"batal":"selesai"});save()}
function delO(i){if(confirm("Hapus order ini?")){S.orders=S.orders.filter(function(o){return o.i!==i});save()}}
V.red=function(){var mm={};S.members.forEach(function(m){mm[m.id]=m});
return '<datalist id="dl">'+S.members.map(function(m){return '<option value="'+esc(m.id+" · "+m.nama)+'">'}).join("")+'</datalist><div class="card"><div class="f"><div><label>Member</label><input id="rm" list="dl" oninput="sal()"></div><div><label>Tanggal</label><input type="date" id="rd" value="'+today()+'"></div><div><label>Tingkat hadiah</label><select id="rt" onchange="sal()">'+RW.map(function(r){return '<option value="'+r[0]+'">'+r[0]+' poin</option>'}).join("")+'</select></div><div><label>Hadiah dipilih</label><input id="rh" placeholder="mis. Cleaner 100ml Fresh"></div></div><p class="mut" id="ri"></p><p>Saldo member: <b id="rs" style="color:var(--gold2)">-</b></p><button class="p" onclick="doR()">Tukar poin</button></div>'+
'<h3>Riwayat penukaran</h3><div class="card sc"><table><tr><th>Tanggal</th><th>Member</th><th class="r">Poin</th><th>Hadiah</th><th></th></tr>'+(S.redeems.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(x){return '<tr><td>'+x.d+'</td><td>'+esc(mm[x.m]?mm[x.m].nama:x.m)+'</td><td class="r">'+x.p+'</td><td>'+esc(x.h)+'</td><td><button class="x" onclick="delR(\''+x.i+'\')">batalkan</button></td></tr>'}).join("")||'<tr><td colspan="5" class="mut">Belum ada penukaran.</td></tr>')+'</table></div>'};
function sal(){var m=find($("rm").value),t=+$("rt").value,r=RW.filter(function(x){return x[0]===t})[0];$("ri").textContent="Isi hadiah: "+r[1];if(m){var c=calc().filter(function(x){return x.m.id===m.id})[0];$("rs").textContent=c.saldo+" poin"}else $("rs").textContent="-"}
function doR(){var m=find($("rm").value),t=+$("rt").value;if(!m)return toast("Pilih member dulu");var c=calc().filter(function(x){return x.m.id===m.id})[0];if(c.saldo<t)return toast("Saldo "+c.saldo+" poin belum cukup untuk "+t+" poin");S.redeems.push({i:Date.now()+"",d:pd($("rd").value)||today(),m:m.id,p:t,h:$("rh").value.trim()});toast("Penukaran tercatat");save()}
function delR(i){if(confirm("Batalkan penukaran ini? Poin dikembalikan.")){S.redeems=S.redeems.filter(function(x){return x.i!==i});save()}}
V.dat=function(){return '<div class="card"><p><b>Member awal</b> dari sheet Membership Hypospot (21 member: kode dan akun).</p><button onclick="seed()">Muat member awal</button></div>'+
'<div class="card"><p><b>Impor member</b> dari Sheets. Kolom: kode (boleh kosong), nama, shopee, tokopedia, tiktok, WA, paket. Dipisah tab atau koma.</p><textarea id="im"></textarea><p><button onclick="impM()">Impor member</button></p></div>'+
'<div class="card"><p><b>Ekspor</b> rekap member (periode terpilih di tab Dashboard) atau cadangan seluruh data.</p><button onclick="exR()">Rekap member (TSV)</button> <button onclick="exB()">Cadangan (JSON)</button><p class="mut">Hasil muncul di kotak ini. Rekap bisa langsung ditempel ke Google Sheets.</p><textarea id="out"></textarea></div>'+
'<div class="card"><p><b>Pulihkan cadangan</b>: tempel JSON cadangan, lalu pulihkan. Ini menimpa data yang ada.</p><textarea id="rs2"></textarea><p><button onclick="rest()">Pulihkan</button></p></div>'};
function seed(){var n=0;SEED.split("\n").forEach(function(l){var c=l.split("|");if(S.members.some(function(m){return m.id===c[0]}))return;S.members.push({id:c[0],nama:c[1],shopee:c[2],tokped:c[3],tiktok:c[4],wa:"",paket:c[5]});n++});toast(n+" member ditambahkan");save()}
function impM(){var n=0;$("im").value.split("\n").forEach(function(l){if(!l.trim())return;var c=l.indexOf("\t")>-1?l.split("\t"):l.split(",");c=c.map(function(x){return x.trim()});if(!c[1])return;var id=c[0]&&/^HYPO/i.test(c[0])?c[0].toUpperCase():nextId();if(S.members.some(function(m){return m.id===id}))return;S.members.push({id:id,nama:c[1],shopee:c[2]||"",tokped:c[3]||"",tiktok:c[4]||"",wa:c[5]||"",paket:c[6]||PK[0]});n++});toast(n+" member diimpor");save()}
function outp(name,t){$("out").value=t;$("out").select();if(DL)DL.save({filename:name,data:t}).catch(function(){});toast("Hasil ada di kotak teks")}
function exR(){var h=["Kode","Nama","Order","Qty","Omzet","Poin diperoleh","Poin ditukar","Saldo","Rata-rata hari antar order","Order terakhir","Segmen"];outp("rekap-member.tsv",[h.join("\t")].concat(calc().map(function(r){return[r.m.id,r.m.nama,r.n,r.q,r.o,r.earn,r.red,r.saldo,r.gap==null?"":r.gap,r.last,r.seg].join("\t")})).join("\n"))}
function exB(){outp("cadangan-member-hypospot.json",JSON.stringify(S))}
function rest(){var v=$("rs2").value.trim();if(!v)return;if(confirm("Timpa semua data dengan cadangan ini?")){load(v);toast("Data dipulihkan");save()}}
try{load(localStorage.getItem("hypo_member")||"")}catch(e){}
R();
if(window.claude&&claude.use){claude.use("downloads").then(function(d){DL=d}).catch(function(){});
claude.use("db").then(function(db){if(!db)return;ref=db.doc("app/data");ref.onSnapshot(function(s){if(s.exists&&s.data()&&s.data().json){load(s.data().json);E=null}R()},function(){ref=null;R()});R()}).catch(function(){})}
</script>
